[project]
name = "imm-simulator"
version = "0.1.0"
description = "Synthetic injection molding machine simulator (M2 healthy baseline)"
requires-python = ">=3.11"
dependencies = [
    "imm-common",
    "numpy>=1.26",
    "aiomqtt>=2.3",
    "pydantic>=2.7",
]

[project.scripts]
imm-sim = "imm_simulator.main:cli"

[tool.uv.sources]
imm-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imm_simulator"]
