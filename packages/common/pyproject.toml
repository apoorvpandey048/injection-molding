[project]
name = "imm-common"
version = "0.1.0"
description = "Shared schemas, MQTT/DB helpers for the IMM platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "aiomqtt>=2.3",
    "asyncpg>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imm_common"]
