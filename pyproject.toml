[project]
name = "imm-sim"
version = "0.1.0"
description = "Injection molding predictive maintenance + digital twin demo"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    # The committed models in artifacts/models/*.pkl are trained with scikit-learn
    # 1.8.x — a fresh venv must use a compatible version to load them, otherwise the
    # server falls back to no-dates/no-quality. If versions ever diverge, retrain:
    #   rm -f artifacts/models/*.pkl && ./demo.sh   (regenerates in the local env)
    "scikit-learn>=1.8",
    "pyarrow>=15.0",
    "jsonschema>=4.22",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["contracts*", "src*"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "playwright>=1.44"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
